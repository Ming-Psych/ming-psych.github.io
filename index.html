<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ming Zhao · Vita</title>
  <link rel="icon" href="./images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  <style>
    :root {
      --text: #2d2d2d;
      --muted: #6b6b6b;
      --line: #e6e6e6;
      --link: #156FA6;
      --bg: #F6F3EC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .masthead {
      border-bottom: 1px solid var(--line);
      padding: 0.85rem 1.5rem;
      position: sticky;
      top: 0;
      background: rgba(246,243,236,0.82);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    .nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 1.35rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav .title {
      font-weight: 700;
      color: var(--text);
      margin-right: auto;
      font-size: 1.15rem;
    }
    .nav a.nav-item {
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      padding: 0.2rem 0;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav a.nav-item:hover {
      color: var(--text);
      text-decoration: none;
    }
    .nav a.nav-item.active {
      color: var(--text);
      font-weight: 600;
      border-bottom-color: #F3BA37;
    }
    .layout {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 3rem;
      padding: 2.5rem 1.5rem 4rem;
    }
    .sidebar { position: sticky; top: 4.5rem; align-self: start; }
    img.avatar, .avatar {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #dfe7f3, #f0f0f0);
      border: 1px solid var(--line);
    }
    .author-name { margin: 0 0 0.25rem; font-size: 1.2rem; font-weight: 700; }
    .author-bio { margin: 0 0 1rem; color: var(--muted); font-size: 0.95rem; }
    .meta { list-style: none; padding: 0; margin: 0; font-size: 0.92rem; }
    .meta li { margin: 0.4rem 0; color: var(--muted); }
    .content h1 {
      font-size: 1.7rem;
      margin: 0 0 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .content p { margin: 0 0 1rem; max-width: 34rem; }
    .footer {
      border-top: none;
      padding: 1.25rem 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; gap: 1.5rem; }
      .sidebar { position: static; display: flex; gap: 1rem; align-items: center; }
      img.avatar, .avatar { width: 110px; height: 110px; flex-shrink: 0; }
      .sidebar-text { flex: 1; }
      .author-name { margin-top: 0; }
    }
  
    .epigraph { margin: 0 0 0.4rem; color: var(--muted); font-style: italic; font-size: 0.9rem; white-space: nowrap; overflow-x: auto; }
    .copyright { margin: 0; }
    .epigraph cite { font-style: normal; font-size: 0.88rem; margin-left: 0.5rem; }
      .footer { border-top: none; padding: 1.25rem 1.5rem; color: var(--muted); font-size: 0.85rem; }
    .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; }
    .footer .epigraph { margin: 0; text-align: left; flex: 1; min-width: 0; }
    .footer .copyright { margin: 0; text-align: right; white-space: nowrap; }
    body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
    body > .layout, body > main.page { width:100%; flex:1 0 auto; }
    body > .footer { margin-top:auto; }
    /* ---- Vita: the winter-river scene is the page background ---- */
    body { background:#F6F3EC; }
    .hero { position:fixed; inset:0; z-index:0; overflow:hidden; background:#F6F3EC; pointer-events:none; }
    .hero canvas.water { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .hero canvas.boat { position:absolute; left:0; top:0; display:block; will-change:transform; }
    .masthead { background:rgba(246,243,236,0.82); border-bottom-color:rgba(0,0,0,0.06); }
    body > .layout, body > .footer { position:relative; z-index:1; }
    body > .layout { align-content:start; }
    .footer { background:transparent; border-top:none; }
    .footer-seal { display:block; width:36px; height:auto; opacity:0.92; }
    .footer-inner { justify-content:flex-start; align-items:center; }
  </style>
</head>
<body>
  <header class="masthead">
    <nav class="nav">
      <a class="title" href="./">Ming Zhao</a>
      <a class="nav-item" href="./opera.html">Opera</a>
      <a class="nav-item" href="./lumina.html">Lumina</a>
      <a class="nav-item active" href="./">Vita</a>
    </nav>
  </header>

  <section class="hero" id="hero" aria-label="A small boat on a wide winter river">
    <canvas class="water" aria-hidden="true"></canvas>
    <canvas class="boat" aria-hidden="true"></canvas>
  </section>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-text">
        <h3 class="author-name">Ming Zhao</h3>
        <p class="author-bio">PhD Candidate in Neuroscience<br>SMART &amp; Westlake University</p>
        <ul class="meta">
          <li><a href="mailto:zhaoming1@smart.org.cn">Email</a></li>
          <li><a href="https://github.com/Ming-Psych">GitHub</a></li>
          <li><a href="https://x.com/PsychZhaoming">X</a></li>
        </ul>
      </div>
    </aside>

    <main class="content">
      <p>I am interested in how the brain learns and forms memories.</p>
      <p>My work focuses on the neural mechanisms of learning and memory.</p>
    </main>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <img class="footer-seal" src="./images/seal.png" width="36" height="35" alt="赵铭">
    </div>
  </footer>
  <script src="./hero.js" defer></script>
</body>
</html>
