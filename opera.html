<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ming Zhao · Opera</title>
  <link rel="icon" href="./images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="./images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
  <style>
    :root { --text:#2d2d2d; --muted:#6b6b6b; --line:#e6e6e6; --link:#156FA6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:var(--text); line-height:1.65; }
    a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
    .masthead { border-bottom:1px solid var(--line); padding:0.85rem 1.5rem; position:sticky; top:0; background:rgba(246,243,236,0.82); z-index:10; }
    .nav { max-width:1100px; margin:0 auto; display:flex; gap:1.35rem; align-items:center; flex-wrap:wrap; }
    .nav .title { font-weight:700; color:var(--text); margin-right:auto; font-size:1.15rem; }
    .nav a.nav-item { color:var(--muted); font-size:0.95rem; padding:0.2rem 0; border-bottom:2px solid transparent; transition:color 0.15s,border-color 0.15s; }
    .nav a.nav-item:hover { color:var(--text); text-decoration:none; }
    .nav a.nav-item.active { color:var(--text); font-weight:600; border-bottom-color:#F3BA37; }
    .page { max-width:860px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
    h1 { font-size:1.7rem; margin:0 0 0.5rem; letter-spacing:-0.01em; }
    h2 { font-size:1.2rem; margin:1.75rem 0 0.75rem; }
    h3 { font-size:1.05rem; margin:0 0 0.6rem; }
    .lead { color:var(--muted); margin:0 0 1.5rem; }
    .project p { margin:0 0 1rem; max-width:42rem; }
    .project figure { margin:0 0 0.5rem; }
    .project img { width:100%; height:auto; border:1px solid var(--line); border-radius:6px; background:transparent; }
    .project figcaption { color:var(--muted); font-size:0.88rem; margin-top:0.5rem; }
    .pub-list { list-style:none; padding:0; margin:0; }
    .pub-list li { padding:0.95rem 0; border-bottom:1px solid var(--line); }
    .pub-title { font-weight:600; }
    .pub-meta { color:var(--muted); font-size:0.92rem; }
    .footer { border-top: none; padding:1.25rem 1.5rem; color:var(--muted); font-size:0.85rem; text-align:center; }
  
    .epigraph { margin: 0 0 0.4rem; color: var(--muted); font-style: italic; font-size: 0.9rem; white-space: nowrap; overflow-x: auto; }
    .copyright { margin: 0; }
    .epigraph cite { font-style: normal; font-size: 0.88rem; margin-left: 0.5rem; }
      .footer { border-top: none; padding: 1.25rem 1.5rem; color: var(--muted); font-size: 0.85rem; }
    .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; }
    .footer .epigraph { margin: 0; text-align: left; flex: 1; min-width: 0; }
    .footer .copyright { margin: 0; text-align: right; white-space: nowrap; }
    body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
    body > .layout, body > main.page { width:100%; flex:1 0 auto; }
    body > .footer { margin-top:auto; }
    /* ---- palette shared with Vita: warm-white page, translucent masthead, borderless transparent footer ---- */
    body { background:#F6F3EC; }
    .masthead { background:rgba(246,243,236,0.82); border-bottom-color:rgba(0,0,0,0.06); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
    .footer { background:transparent; border-top:none; }
    .footer-seal { display:block; width:36px; height:auto; opacity:0.92; }
    .footer-inner { justify-content:flex-start; align-items:center; }
  </style>
</head>
<body>
  <header class="masthead">
    <nav class="nav">
      <a class="title" href="./">Ming Zhao</a>
      <a class="nav-item active" href="./opera.html">Opera</a>
      <a class="nav-item" href="./lumina.html">Lumina</a>
      <a class="nav-item" href="./">Vita</a>
    </nav>
  </header>
  <main class="page">
    <h1>Opera</h1>
    <p class="lead">Selected publications and ongoing work will appear here.</p>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <img class="footer-seal" src="./images/seal.png" width="36" height="35" alt="赵铭">
    </div>
  </footer>
</body>
</html>
