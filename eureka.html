<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eureka · Ming Zhao</title>
  <style>
    :root { --text:#2d2d2d; --muted:#6b6b6b; --line:#e6e6e6; --link:#2a7ae2; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:var(--text); line-height:1.65; }
    a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
    .masthead { border-bottom:1px solid var(--line); padding:0.85rem 1.5rem; position:sticky; top:0; background:rgba(255,255,255,0.95); z-index:10; }
    .nav { max-width:1100px; margin:0 auto; display:flex; gap:1.35rem; align-items:center; flex-wrap:wrap; }
    .nav .title { font-weight:700; color:var(--text); margin-right:auto; font-size:1.15rem; }
    .nav a.nav-item { color:var(--muted); font-size:0.95rem; padding:0.2rem 0; border-bottom:2px solid transparent; transition:color 0.15s,border-color 0.15s; }
    .nav a.nav-item:hover { color:var(--text); text-decoration:none; }
    .nav a.nav-item.active { color:var(--text); font-weight:600; border-bottom-color:#F3BA37; }
    .page { max-width:720px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
    h1 { font-size:1.7rem; margin:0 0 0.5rem; letter-spacing:-0.01em; }
    .lead { color:var(--muted); margin:0 0 1.5rem; }
    .note-list { list-style:none; padding:0; margin:0; }
    .note-list li { padding:0.95rem 0; border-bottom:1px solid var(--line); }
    .note-title { font-weight:600; }
    .note-meta { color:var(--muted); font-size:0.92rem; }
    .footer { border-top:1px solid var(--line); padding:1.25rem 1.5rem; color:var(--muted); font-size:0.85rem; text-align:center; }
  
    .epigraph { margin: 0 0 0.4rem; color: var(--muted); font-style: italic; font-size: 0.9rem; white-space: nowrap; overflow-x: auto; }
    .copyright { margin: 0; }
    .epigraph cite { font-style: normal; font-size: 0.88rem; margin-left: 0.5rem; }
      .footer { border-top: 1px solid var(--line); padding: 1.25rem 1.5rem; color: var(--muted); font-size: 0.85rem; }
    .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; }
    .footer .epigraph { margin: 0; text-align: left; flex: 1; min-width: 0; }
    .footer .copyright { margin: 0; text-align: right; white-space: nowrap; }
  
    .eureka-head { display:flex; align-items:center; gap:0.9rem; margin:0 0 0.5rem; }
    .eureka-head h1 { margin:0; }
    .bulb-mark { display:flex; align-items:center; gap:0.7rem; }
    .bulb-mark .divider { width:1px; height:34px; background:var(--line); }
    .bulb { width:42px; height:42px; overflow:visible; }
    .bulb .glass { fill:#fff; stroke:#2B303C; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; animation: bulbFill 3.6s ease-in-out infinite; }
    .bulb .base, .bulb .filament { fill:none; stroke:#2B303C; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .bulb .filament { animation: filament 3.6s ease-in-out infinite; }
    .bulb .rays path { fill:none; stroke:#F3BA37; stroke-width:2.6; stroke-linecap:round; opacity:0; animation: rays 3.6s ease-in-out infinite; }
    @keyframes bulbFill { 0%,35% { fill:#fff; } 50%,85% { fill:#F8D27A; } 100% { fill:#fff; } }
    @keyframes filament { 0%,35% { stroke:#2B303C; } 50%,85% { stroke:#B07A10; } 100% { stroke:#2B303C; } }
    @keyframes rays { 0%,40% { opacity:0; } 55%,82% { opacity:1; } 100% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .bulb .glass, .bulb .filament, .bulb .rays path { animation:none; } }
  </style>
</head>
<body>
  <header class="masthead">
    <nav class="nav">
      <a class="title" href="./">Ming Zhao</a>
      <a class="nav-item" href="./opera.html">Opera</a>
      <a class="nav-item active" href="./eureka.html">Eureka</a>
      <a class="nav-item" href="./">Vita</a>
    </nav>
  </header>
  <main class="page">
    <div class="eureka-head">
      <h1>Eureka</h1>
      <span class="bulb-mark" aria-hidden="true">
        <span class="divider"></span>
        <svg class="bulb" viewBox="0 0 40 40">
          <defs>
            <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
            </filter>
          </defs>
          <g filter="url(#rough)">
            <g class="rays">
              <path d="M20 2.5c.2 1 .1 2.1-.1 3.2"/>
              <path d="M8.2 7.4c.9.6 1.6 1.4 2.2 2.3"/>
              <path d="M31.9 7.1c-.8.8-1.5 1.6-2.1 2.5"/>
              <path d="M3.6 18.6c1.1-.1 2.2 0 3.3.2"/>
              <path d="M36.5 18.3c-1.1 0-2.2.2-3.2.4"/>
            </g>
            <path class="glass" d="M20.3 8.6c-5.6-.3-9.9 4-9.6 9.2.2 3.1 1.9 5.2 3.6 6.9.9.9 1.2 2 1.2 3.3l.1.9c2.6.4 5.2.3 7.8-.1l.1-1c.1-1.2.6-2.2 1.5-3.1 1.8-1.8 3.4-4.1 3.3-7.2-.2-5-3.3-8.6-8-8.9z"/>
            <path class="filament" d="M17.2 26.2c.3-2 .6-3.9.4-5.8.9.9 1.7 1.4 2.5.2.7 1.1 1.6.9 2.4-.1-.2 1.9-.1 3.8.3 5.7"/>
            <path class="base" d="M15.9 30.6c2.8.4 5.6.3 8.3-.1M16.6 33.3c2.3.3 4.6.3 6.9-.1M18.4 35.9c1.1.2 2.2.2 3.3 0"/>
          </g>
        </svg>
      </span>
    </div>
    <p class="lead">Short notes and reflections — little boosts worth keeping.</p>
    <ul class="note-list">
      <li>
        <div class="note-title"><a href="#">First note title</a></div>
        <div class="note-meta">Date · short description</div>
      </li>
      <li>
        <div class="note-title"><a href="#">Second note title</a></div>
        <div class="note-meta">Date · short description</div>
      </li>
    </ul>
</main>
  <footer class="footer">
    <div class="footer-inner">
      <p class="epigraph">“北海，我只能告诉你那以前要多想。” <cite>— 刘慈欣，<em>三体Ⅱ：黑暗森林</em></cite></p>
      <p class="copyright">© 2026 Ming Zhao</p>
    </div>
  </footer>
</body>
</html>
